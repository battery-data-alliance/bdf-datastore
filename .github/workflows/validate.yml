name: Validate Structure

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false  # skip LFS download; validation only checks metadata + file presence

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pytest

      - name: Run unit tests
        run: python -m pytest scripts/tests/ -v

      - name: Run structure validation
        run: python scripts/validate_structure.py .

      - name: Run quality validation
        run: python scripts/validate_quality.py .

      - name: Collect metrics and check alert thresholds
        run: python scripts/collect_metrics.py . --json-output metrics.json
        # Exits non-zero if any alert threshold is violated, failing the job.
        # Also writes a Markdown job summary via $GITHUB_STEP_SUMMARY.

      - name: Run health check
        run: python scripts/health_check.py . --json

      - name: Generate dashboard
        if: always()
        run: python scripts/generate_dashboard.py metrics.json --output dashboard.html

      - name: Upload metrics artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-metrics
          path: |
            metrics.json
            dashboard.html
          retention-days: 90

      - name: Comment on PR with failure details
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let metrics = {};
            try { metrics = JSON.parse(fs.readFileSync('metrics.json', 'utf8')); } catch {}

            const score = metrics.consistency_score != null
              ? `${(metrics.consistency_score * 100).toFixed(1)}%` : 'unknown';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: [
                '## Validation Failed',
                '',
                '| Metric | Value |',
                '|--------|-------|',
                `| Cells | ${metrics.cell_counts?.total ?? 'unknown'} |`,
                `| Consistency score | ${score} |`,
                `| Structure errors | ${metrics.structure_errors ?? 'unknown'} |`,
                `| Quality errors | ${metrics.quality_errors ?? 'unknown'} |`,
                '',
                `See the [workflow run](${runUrl}) for full details and downloadable dashboard.`,
              ].join('\n'),
            });
