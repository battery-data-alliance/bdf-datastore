name: CI Health Monitor

# Runs on a schedule to proactively detect health regressions.
# On failure: opens a GitHub issue (or comments on an existing one).
# On recovery: auto-closes the open health issue.
#
# Detection latency: ≤ 6 hours (scheduled), or immediate via workflow_dispatch.

on:
  schedule:
    - cron: '0 */6 * * *'  # Every 6 hours
  workflow_dispatch:

jobs:
  health-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pytest

      - name: Run health check
        id: health
        run: python scripts/health_check.py . --json > health-report.json
        continue-on-error: true

      - name: Upload health report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: health-report-${{ github.run_id }}
          path: health-report.json
          retention-days: 30

      - name: Open or update issue on failure
        if: steps.health.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let report = {};
            try {
              report = JSON.parse(fs.readFileSync('health-report.json', 'utf8'));
            } catch {
              report = { status: 'critical', issues: ['Failed to parse health report'], cell_count: 0, consistency_score: 0 };
            }

            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const issueBody = [
              '## Health Check Failed',
              '',
              `**Status:** \`${report.status || 'unknown'}\``,
              `**Checked at:** ${report.timestamp || new Date().toISOString()}`,
              `**Cells:** ${report.cell_count ?? 'unknown'}`,
              `**Consistency score:** ${((report.consistency_score ?? 0) * 100).toFixed(1)}%`,
              `**Structure errors:** ${report.structure_errors ?? 'unknown'}`,
              `**Quality errors:** ${report.quality_errors ?? 'unknown'}`,
              '',
              '### Issues',
              ...(Array.isArray(report.issues) && report.issues.length > 0
                ? report.issues.map(i => `- ${i}`)
                : ['_(no detailed errors available)_']),
              '',
              `**Workflow run:** ${runUrl}`,
              '',
              '_Auto-created by CI Health Monitor. Will be closed automatically when health is restored._',
            ].join('\n');

            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'ci-health',
              state: 'open',
            });

            if (existing.length === 0) {
              const { data: issue } = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `[Health Monitor] CI health degraded — ${new Date().toISOString().slice(0, 10)}`,
                body: issueBody,
                labels: ['ci-health'],
              });
              core.info(`Created health issue #${issue.number}`);
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing[0].number,
                body: `### Still failing — ${new Date().toISOString()}\n\n${issueBody}`,
              });
              core.info(`Updated health issue #${existing[0].number}`);
            }

      - name: Close health issue on recovery
        if: steps.health.outcome == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'ci-health',
              state: 'open',
            });

            for (const issue of existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `Health check passing again as of ${new Date().toISOString()}. Auto-closing.`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
              });
              core.info(`Closed health issue #${issue.number}`);
            }
